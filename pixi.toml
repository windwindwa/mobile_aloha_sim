[workspace]
name = "ros1_hybrid_env"
version = "0.1.0"
description = "ROS1 environment managed by pixi + system ros"
authors = ["Your Name <your.email@example.com>"]
channels = ["conda-forge", "robostack-staging"] # Robostack 用于兼容 ROS 包
platforms = ["linux-64"]

# --- 全局任务 ---
[tasks]
# 快捷指令
build = "catkin_make"
clean = "catkin_make clean"

# --- 功能特性定义 (Features) ---

# 1. ROS1 Python 开发环境 (Python 3.8 匹配 Noetic)
[feature.ros1.dependencies]
python = "3.8.*"
# 安装基础工具，ROS 核心包通常使用系统环境，
# 但为了代码补全和 pixi 独立性，建议安装 rospkg 等
rospkg = "*" 
catkin_pkg = "*"
numpy = "*"
pyyaml = "*"

# 2. 备用通用环境 (Backup Env, 最新 Python)
[feature.backup.dependencies]
python = "3.11.*"
pandas = "*"
numpy = "*"
requests = "*"
pytest = "*"
jupyter = "*"

# --- 环境定义 (Environments) ---
# 组合 feature 生成环境

[environments]
# 默认环境 (ROS1)
default = ["ros1"]
# 显式命名 ROS1 环境
ros1-python-env = ["ros1"]
# 备用环境
backup-python-env = ["backup"]

[dependencies]
pyqt = ">=5.15.9,<6"
